[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-physics"
version = "0.1.0"
description = "Offline ResearchOS TECT research prototype for physics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
researchos = "researchos.__main__:main"

[tool.setuptools.packages.find]
include = ["researchos*"]

[tool.setuptools.package-data]
researchos = ["*.json"]
